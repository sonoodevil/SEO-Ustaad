/* longest first so "سرچ کنسول" wins over "سرچ" */
const URDU_TO_EN_SORTED = URDU_TO_EN.slice().sort((a, b) => b[0].length - a[0].length);
function naturalizeUrdu(text) {
  let out = String(text);
  for (const pair of URDU_TO_EN_SORTED) {
    out = out.split(pair[0]).join(pair[1]);
  }
  /* Urdu plural markers left stuck to a Latin word: "linkس" -> "links" */
  out = out.replace(/([A-Za-z])(?:س|ز)(?![\u0600-\u06FF])/g, "$1s");
  /* keep Latin and Urdu from gluing together, which confuses the voice */
  out = out.replace(/([A-Za-z])([\u0600-\u06FF])/g, "$1 $2");
  out = out.replace(/([\u0600-\u06FF])([A-Za-z])/g, "$1 $2");
  return out.replace(/ {2,}/g, " ");
}

/* ---------- Gemini TTS (natural Urdu accent, uses the SAME Gemini key) ----------
   Docs: https://ai.google.dev/gemini-api/docs/speech-generation
   Returns raw PCM 24kHz mono 16-bit as base64 -> we wrap it in a WAV header.   */
const GEM_TTS_MODELS = ["gemini-3.1-flash-tts-preview", "gemini-2.5-flash-preview-tts", "gemini-2.5-pro-preview-tts"];
const GEM_VOICES = ["Kore", "Aoede", "Leda", "Callirrhoe", "Autonoe", "Despina", "Erinome", "Laomedeia", "Achernar", "Sulafat", "Puck", "Charon", "Fenrir", "Orus", "Enceladus", "Iapetus", "Algieba", "Algenib", "Rasalgethi", "Zephyr"];
const GEM_DEFAULT_VOICE = "Kore";
function b64ToBytes(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

/* raw 16-bit PCM -> playable WAV blob */
function pcmToWavBlob(pcm, sampleRate, channels) {
  const rate = sampleRate || 24000,
    ch = channels || 1,
    bps = 16;
  const blockAlign = ch * bps / 8,
    byteRate = rate * blockAlign;
  const buf = new ArrayBuffer(44 + pcm.length);
  const v = new DataView(buf);
  const str = (off, s2) => {
    for (let i = 0; i < s2.length; i++) v.setUint8(off + i, s2.charCodeAt(i));
  };
  str(0, "RIFF");
  v.setUint32(4, 36 + pcm.length, true);
  str(8, "WAVE");
  str(12, "fmt ");
  v.setUint32(16, 16, true);
  v.setUint16(20, 1, true);
  v.setUint16(22, ch, true);
  v.setUint32(24, rate, true);
  v.setUint32(28, byteRate, true);
  v.setUint16(32, blockAlign, true);
  v.setUint16(34, bps, true);
  str(36, "data");
  v.setUint32(40, pcm.length, true);
  new Uint8Array(buf, 44).set(pcm);
  return new Blob([buf], {
    type: "audio/wav"
  });
}
function rateFromMime(mime) {
  const m = /rate=(\d+)/.exec(mime || "");
  return m ? parseInt(m[1], 10) : 24000;
}
async function geminiSpeak(key, voiceName, text, lang) {
  if (!key) throw new Error("NO_GEM_KEY");
  const style = lang === "ur" ? "Aap ek Pakistani ustad hain jo Lahore ki class mein parha rahe hain. Neeche diya gaya matn bilkul usi tarah bolein jaise aam Urdu bol chaal mein bola jata hai: jumla Urdu mein, magar technical English alfaz (crawling, indexing, keyword, title tag, schema, backlink waghera) English lehje mein hi bolein — unka Urdu tarjuma ya Urdu talaffuz na karein. Lehja mehrbaan aur itminaan wala ho, raftar mutawassit:\n\n" : "Read the following clearly and warmly, like a patient teacher:\n\n";
  const errs = [];
  for (const model of GEM_TTS_MODELS) {
    try {
      const res = await fetch("https://generativelanguage.googleapis.com/v1beta/models/" + model + ":generateContent?key=" + encodeURIComponent(key), {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          contents: [{
            parts: [{
              text: style + text
            }]
          }],
          generationConfig: {
            responseModalities: ["AUDIO"],
            speechConfig: {
              voiceConfig: {
                prebuiltVoiceConfig: {
                  voiceName: voiceName || GEM_DEFAULT_VOICE
                }
              }
            }
          }
        })
      });
      const data = await res.json();
      if (!res.ok) {
        errs.push(model + ": " + (data.error && data.error.message || "HTTP " + res.status));
        continue;
      }
      const part = data && data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts && data.candidates[0].content.parts[0];
      const inline = part && (part.inlineData || part.inline_data);
      if (!inline || !inline.data) {
        errs.push(model + ": no audio returned");
        continue;
      }
      const mime = inline.mimeType || inline.mime_type || "";
      const bytes = b64ToBytes(inline.data);
      /* some responses already carry a WAV container */
      if (/wav/i.test(mime) || bytes[0] === 82 && bytes[1] === 73 && bytes[2] === 70 && bytes[3] === 70) return new Blob([bytes], {
        type: "audio/wav"
      });
      return pcmToWavBlob(bytes, rateFromMime(mime), 1);
    } catch (e) {
      errs.push(model + ": " + (e.message || String(e)));
    }
  }
  throw new Error("Gemini TTS — " + errs.join(" | "));
}

/* ---------- ElevenLabs voice (natural Urdu) ----------
   Two keys are tried in turn, then the browser voice takes over.
   Docs: https://elevenlabs.io/docs/api-reference/text-to-speech/convert   */
const EL_MODEL = "eleven_multilingual_v2";
const EL_DEFAULT_VOICE = "21m00Tcm4TlvDq8ikWAM"; // Rachel — multilingual, safe default

async function elFetchAudio(key, voiceId, text) {
  const res = await fetch("https://api.elevenlabs.io/v1/text-to-speech/" + encodeURIComponent(voiceId || EL_DEFAULT_VOICE), {
    method: "POST",
    headers: {
      "xi-api-key": key,
      "Content-Type": "application/json",
      "Accept": "audio/mpeg"
    },
    body: JSON.stringify({
      text: text,
      model_id: EL_MODEL,
      voice_settings: {
        stability: 0.5,
        similarity_boost: 0.75,
        style: 0.0,
        use_speaker_boost: true
      }
    })
  });
  if (!res.ok) {
    let msg = "HTTP " + res.status;
    try {
      const j = await res.json();
      msg = j.detail && (j.detail.message || j.detail.status) || msg;
    } catch (e) {}
    throw new Error(msg);
  }
  return await res.blob();
}

/* tries key1, then key2; throws only when every key failed */
async function elSpeak(keys, voiceId, text) {
  const list = [keys.eleven1, keys.eleven2].filter(k => k && k.trim());
  if (!list.length) throw new Error("NO_EL_KEY");
  const errs = [];
  for (const k of list) {
    try {
      return await elFetchAudio(k.trim(), voiceId, text);
    } catch (e) {
      errs.push(e.message);
    }
  }
  throw new Error("ElevenLabs: " + errs.join(" | "));
}

/* ---------- Text-to-Speech engine ---------- */
function chunkText(text, size) {
  const parts = String(text).replace(/\s+/g, " ").replace(/([.!?\u06D4\u061F])\s/g, "$1\u0001").split("\u0001");
  const out = [];
  let buf = "";
  parts.forEach(p => {
    if ((buf + " " + p).trim().length > size) {
      if (buf) out.push(buf.trim());
      buf = p;
    } else {
      buf = (buf + " " + p).trim();
    }
  });
  if (buf) out.push(buf.trim());
  return out.filter(Boolean);
}
function useTTS(initialRate) {
  const [state, setState] = useState("idle"); // idle | loading | playing | paused
  const [engine, setEngine] = useState("browser"); // which engine actually played
  const [voiceErr, setVoiceErr] = useState("");
  const audioRef = useRef(null);
  const elQueue = useRef([]);
  const elIdx = useRef(0);
  const elStop = useRef(false);
  const [rate, setRate] = useState(initialRate || 1);
  const [supported] = useState(() => typeof window !== "undefined" && "speechSynthesis" in window);
  const queue = useRef([]);
  const idx = useRef(0);
  const langRef = useRef("en-US");
  const rateRef = useRef(initialRate || 1);
  useEffect(() => {
    rateRef.current = rate;
  }, [rate]);
  const pickVoice = useCallback(code => {
    if (!supported) return null;
    const vs = window.speechSynthesis.getVoices() || [];
    return vs.find(v => v.lang && v.lang.toLowerCase() === code.toLowerCase()) || vs.find(v => v.lang && v.lang.toLowerCase().startsWith(code.split("-")[0])) || null;
  }, [supported]);
  const speakNext = useCallback(() => {
    if (!supported) return;
    if (idx.current >= queue.current.length) {
      setState("idle");
      return;
    }
    const u = new SpeechSynthesisUtterance(queue.current[idx.current]);
    u.lang = langRef.current;
    u.rate = rateRef.current;
    u.pitch = 1;
    const v = pickVoice(langRef.current);
    if (v) u.voice = v;
    u.onend = () => {
      idx.current += 1;
      speakNext();
    };
    u.onerror = () => {
      idx.current += 1;
      speakNext();
    };
    window.speechSynthesis.speak(u);
  }, [supported, pickVoice]);
  const playBrowser = useCallback((text, langCode, mix) => {
    if (!supported) return;
    window.speechSynthesis.cancel();
    langRef.current = langCode || "en-US";
    queue.current = chunkText(langCode === "ur-PK" && mix ? naturalizeUrdu(text) : text, 180);
    idx.current = 0;
    setEngine("browser");
    setState("playing");
    setTimeout(speakNext, 60);
  }, [supported, speakNext]);
  const stopAll = useCallback(() => {
    elStop.current = true;
    if (supported) window.speechSynthesis.cancel();
    queue.current = [];
    idx.current = 0;
    if (audioRef.current) {
      try {
        audioRef.current.pause();
      } catch (e) {}
      try {
        URL.revokeObjectURL(audioRef.current.src);
      } catch (e) {}
      audioRef.current = null;
    }
    elQueue.current = [];
    elIdx.current = 0;
    setState("idle");
  }, [supported]);
  const elPlayNext = useCallback(async o => {
    if (elStop.current) return;
    if (elIdx.current >= elQueue.current.length) {
      setState("idle");
      return;
    }
    setState("loading");
    try {
      let piece = elQueue.current[elIdx.current];
      if (o.lang === "ur" && o.mix !== false) piece = naturalizeUrdu(piece);
      const blob = o.engine === "gemini" ? await geminiSpeak(o.keys.gemini, o.gemVoice, piece, o.lang) : await elSpeak(o.keys, o.voiceId, piece);
      if (elStop.current) return;
      const url = URL.createObjectURL(blob);
      const a = new Audio(url);
      a.playbackRate = rateRef.current;
      audioRef.current = a;
      a.onended = () => {
        try {
          URL.revokeObjectURL(url);
        } catch (e) {}
        elIdx.current += 1;
        elPlayNext(o);
      };
      a.onerror = () => {
        elIdx.current += 1;
        elPlayNext(o);
      };
      await a.play();
      setState("playing");
    } catch (e) {
      // any failure -> fall back to the browser voice for the rest of the passage
      setVoiceErr(e.message === "NO_EL_KEY" || e.message === "NO_GEM_KEY" ? "" : e.message);
      const rest = elQueue.current.slice(elIdx.current).join(" ");
      elQueue.current = [];
      elIdx.current = 0;
      playBrowser(rest, langRef.current, false);
    }
  }, [playBrowser]);

  /* play(text, langCode, opts)
     opts = { engine:"browser"|"gemini"|"eleven", keys, voiceId, gemVoice, lang } */
  const play = useCallback((text, langCode, opts) => {
    stopAll();
    elStop.current = false;
    setVoiceErr("");
    langRef.current = langCode || "en-US";
    const o = opts || {};
    const k = o.keys || {};
    const hasEl = k.eleven1 && k.eleven1.trim() || k.eleven2 && k.eleven2.trim();
    const hasGem = k.gemini && k.gemini.trim();
    if (o.engine === "gemini" && hasGem) {
      setEngine("gemini");
      elQueue.current = chunkText(text, 1200);
      elIdx.current = 0;
      elPlayNext(o);
      return;
    }
    if (o.engine === "eleven" && hasEl) {
      setEngine("eleven");
      elQueue.current = chunkText(text, 1800);
      elIdx.current = 0;
      elPlayNext(o);
      return;
    }
    playBrowser(text, langCode, o.mix !== false && langCode === "ur-PK");
  }, [stopAll, playBrowser, elPlayNext]);
  const pause = useCallback(() => {
    if (audioRef.current && !audioRef.current.paused) {
      audioRef.current.pause();
      setState("paused");
      return;
    }
    if (supported) {
      window.speechSynthesis.pause();
      setState("paused");
    }
  }, [supported]);
  const resume = useCallback(() => {
    if (audioRef.current && audioRef.current.paused) {
      audioRef.current.play();
      setState("playing");
      return;
    }
    if (supported) {
      window.speechSynthesis.resume();
      setState("playing");
    }
  }, [supported]);
  const stop = stopAll;
  useEffect(() => {
    if (audioRef.current) audioRef.current.playbackRate = rate;
  }, [rate]);
  useEffect(() => () => {
    elStop.current = true;
    if (supported) window.speechSynthesis.cancel();
    if (audioRef.current) {
      try {
        audioRef.current.pause();
      } catch (e) {}
    }
  }, [supported]);
  useEffect(() => {
    if (supported) {
      const f = () => window.speechSynthesis.getVoices();
      f();
      window.speechSynthesis.onvoiceschanged = f;
    }
  }, [supported]);
  return {
    state,
    play,
    pause,
    resume,
    stop,
    rate,
    setRate,
    supported,
    engine,
    voiceErr
  };
}

/* ---------- Speech recognition (mic) ---------- */
function useMic(onResult) {
  const [listening, setListening] = useState(false);
  const recRef = useRef(null);
  const SR = typeof window !== "undefined" ? window.SpeechRecognition || window.webkitSpeechRecognition : null;
  const supported = !!SR;
  const start = useCallback(langCode => {
    if (!SR) return;
    try {
      if (recRef.current) {
        try {
          recRef.current.abort();
        } catch (e) {}
      }
      const r = new SR();
      r.lang = langCode || "en-US";
      r.interimResults = false;
      r.maxAlternatives = 1;
      r.continuous = false;
      r.onstart = () => setListening(true);
      r.onerror = () => setListening(false);
      r.onend = () => setListening(false);
      r.onresult = e => {
        const txt = Array.from(e.results).map(x => x[0].transcript).join(" ").trim();
        if (txt) onResult(txt);
      };
      recRef.current = r;
      r.start();
    } catch (e) {
      setListening(false);
    }
  }, [SR, onResult]);
  const stop = useCallback(() => {
    try {
      recRef.current && recRef.current.stop();
    } catch (e) {}
    setListening(false);
  }, []);
  return {
    listening,
    start,
    stop,
    supported
  };
}

const GEMINI_MODELS = ["gemini-2.5-flash", "gemini-2.0-flash", "gemini-1.5-flash"];

async function askGemini(key, sys, history, question) {

      const txt = data && data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts && data.candidates[0].content.parts.map(p => p.text || "").join("");
      if (txt && txt.trim()) return txt.trim();

async function askGroq(key, sys, history, question) {

  }].concat(history.slice(-6).map(m => ({
    role: m.role === "user" ? "user" : "assistant",
    content: m.text
  }))).concat([{
    role: "user",
    content: question
  }]);
  const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + key
    },
    body: JSON.stringify({
      model: GROQ_MODEL,

    })

  const data = await res.json();
  if (!res.ok) throw new Error("Groq: " + (data && data.error && data.error.message || "HTTP " + res.status));
  const txt = data && data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;

async function askAI(keys, lang, weekTitle, history, question) {
